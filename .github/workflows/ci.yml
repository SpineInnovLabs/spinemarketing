# Optional PR feedback on GitHub; primary CI/CD is CircleCI (.circleci/config.yml).
name: CI (PR build only)

on:
  pull_request:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: https://spineinnovlabs.spineworkspace.com

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
