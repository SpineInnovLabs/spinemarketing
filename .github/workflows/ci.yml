# Manual fallback QA only; CircleCI is authoritative for deployments.
# Keeping this opt-in avoids duplicate builds when CircleCI credits are restored.
name: Manual marketing QA

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: https://spineinnovlabs.spineworkspace.com

jobs:
  build:
    name: Static release verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Repository preflight
        run: npm run lint

      - name: Validate CircleCI contract
        run: npm run check:ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Static export
        run: npm run build
