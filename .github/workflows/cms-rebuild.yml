# Cloudflare Workers Builds performs the actual rebuild and deployment.
# Preferred: Sanity webhook -> Cloudflare Deploy Hook directly.
# This optional GitHub repository_dispatch bridge exists for existing Sanity integrations.
name: Rebuild corporate site on Cloudflare

on:
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-cloudflare-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger native Cloudflare Workers Build
        env:
          CLOUDFLARE_WORKERS_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_HOOK }}
        run: |
          if [ -z "$CLOUDFLARE_WORKERS_DEPLOY_HOOK" ]; then
            echo "ERROR: Configure CLOUDFLARE_WORKERS_DEPLOY_HOOK in GitHub repository secrets or point the Sanity webhook directly at the Cloudflare hook." >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            --request POST \
            "$CLOUDFLARE_WORKERS_DEPLOY_HOOK" \
            --output /tmp/cloudflare-build-result.json
          node -e 'const r=require("/tmp/cloudflare-build-result.json");if(r.success!==true){console.error("Cloudflare did not accept build:",JSON.stringify(r.errors||[]));process.exit(1)}console.log("Cloudflare Workers Build accepted:",r.result?.build_uuid||"build queued")'
