[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # Match the GitHub Actions build. An unpinned Netlify Node failed the last git deploy.
  NODE_VERSION = "22"

# Existing static pages would otherwise win over these moves.
[[redirects]]
  from = "/docs"
  to = "https://docs.spineworkspace.com/"
  status = 301
  force = true

[[redirects]]
  from = "/platform/the-adaptive-spine"
  to = "/platform/spine-fabric"
  status = 301
  force = true

[[redirects]]
  from = "/ai"
  to = "/twin"
  status = 301
  force = true

[[redirects]]
  from = "/why"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/product"
  to = "/spineworkspace"
  status = 301
  force = true

[[redirects]]
  from = "/product/how-it-works"
  to = "/platform/how-it-works"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
