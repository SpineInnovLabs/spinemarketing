  test:
    spine_innovlabs:
      public_url: https://spineinnovlabs.spineworkspace.com
      canonical_url: https://spineinnovlabs.com
    spine_workspace:
      apex: https://spineworkspace.com
      app: https://app.spineworkspace.com
      auth: https://auth.spineworkspace.com
      domain_root: spineworkspace.com

  dev:
    spine_innovlabs:
      public_url: https://spineinnovlabs-marketing-dev.workers.dev
      canonical_url: https://spineinnovlabs.com
    spine_workspace:
      apex: https://spineworkspace.com
      app: https://app.spineworkspace.com
      auth: https://auth.spineworkspace.com
      domain_root: spineworkspace.com

navigation:
