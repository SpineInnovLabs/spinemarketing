# Spine InnovLabs corporate marketing — CircleCI -> Cloudflare Workers
# Deployment authority: the CircleCI build artifact, not GitHub/Vercel.
# Required CircleCI project secret: CLOUDFLARE_API_TOKEN (scoped Workers deploy).
# Optional project setting: CLOUDFLARE_ACCOUNT_ID (also set in wrangler.jsonc).
# SANITY_PROJECT_ID / SANITY_API_READ_TOKEN are required for CMS-backed content.
version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:22.11
    resource_class: medium

commands:
  install-dependencies:
    steps:
      - restore_cache:
          keys:
            - v1-marketing-npm-{{ arch }}-{{ checksum "package-lock.json" }}
            - v1-marketing-npm-{{ arch }}-
      - run:
          name: Install locked dependencies (cached npm tarballs)
          command: |
            node --version
            npm --version
            npm ci --prefer-offline --no-audit --no-fund

  require-cloudflare-token:
    steps:
      - run:
          name: Verify non-interactive Cloudflare authentication
          command: |
            if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
              echo "ERROR: CircleCI project secret CLOUDFLARE_API_TOKEN is missing." >&2
              echo "Create a scoped Cloudflare Workers API token and add it in CircleCI Project Settings > Environment Variables." >&2
              echo "Do not use expiring WRANGLER_OAUTH_TOKEN/WRANGLER_REFRESH_TOKEN in CI." >&2
              exit 1
            fi
            if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
              echo "CLOUDFLARE_ACCOUNT_ID not set; Wrangler will use account_id in wrangler.jsonc."
            fi
            npx wrangler whoami > /dev/null
            echo "Cloudflare API token accepted by Wrangler."

  optional-datadog-dora:
    parameters:
      environment:
        type: string
    steps:
      - run:
          name: Report deployment to Datadog (non-blocking)
          command: |
            export DATADOG_API_KEY="${DATADOG_API_KEY:-${DD_API_KEY:-}}"
            export DATADOG_SITE="${DATADOG_SITE:-${DD_SITE:-datadoghq.com}}"
            if [ -z "$DATADOG_API_KEY" ]; then
              echo "Datadog credentials not configured; skipping optional DORA report."
              exit 0
            fi
            npx --yes @datadog/datadog-ci@2 dora deployment \
              --service spineinnovlabs-marketing \
              --env "<< parameters.environment >>" \
              --started-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --git-commit-sha "${CIRCLE_SHA1}" \
              --git-repository-url "${CIRCLE_REPOSITORY_URL}" \
              || echo "WARNING: Datadog report failed, but deployment is not rolled back."

jobs:
  build:
    executor: node-executor
    environment:
      NEXT_PUBLIC_SITE_URL: https://spineinnovlabs.spineworkspace.com
      CONTENT_PROVIDER: sanity
      SANITY_DATASET: production
    steps:
      - checkout
      - install-dependencies
      - save_cache:
          key: v1-marketing-npm-{{ arch }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Validate repository release hygiene
          command: npm run lint
      - run:
          name: Validate CircleCI YAML and release contract
          command: npm run check:ci
      - run:
          name: Build Next.js static export
          command: |
            npm run build
      - run:
          name: Validate production artifact and corporate homepage
          command: |
            test -s out/index.html || { echo "ERROR: static export out/index.html missing"; exit 1; }
            grep -Fq "more connected business" out/index.html || {
              echo "ERROR: homepage build is missing the approved Spine InnovLabs hero"; exit 1;
            }
            test -s out/sitemap.xml || { echo "ERROR: sitemap.xml missing"; exit 1; }
            echo "Static export and corporate homepage confirmed."
      - persist_to_workspace:
          root: .
          paths:
            - out

  deploy:
    executor: node-executor
    parameters:
      wrangler_env:
        type: enum
        enum: [dev, test, prod]
      datadog_env:
        type: string
    steps:
      - checkout
      - attach_workspace:
          at: .
      - install-dependencies
      - require-cloudflare-token
      - run:
          name: Check packaged static artifact
          command: |
            test -s out/index.html || { echo "ERROR: no compiled asset artifact from build"; exit 1; }
            grep -Fq "more connected business" out/index.html || {
              echo "ERROR: artifact does not match approved homepage"; exit 1;
            }
      - run:
          name: Deploy Cloudflare Worker (<< parameters.wrangler_env >>)
          command: |
            npx wrangler deploy --env << parameters.wrangler_env >>
      - when:
          condition:
            equal: [prod, << parameters.wrangler_env >>]
          steps:
            - run:
                name: Verify production hostname shows new hero
                command: |
                  TARGET="https://spineinnovlabs.spineworkspace.com/?ci=${CIRCLE_SHA1}"
                  success=0
                  for attempt in 1 2 3 4 5 6 7 8; do
                    if curl --fail --silent --show-error --location \
                      --connect-timeout 10 --max-time 30 \
                      --header "Cache-Control: no-cache" \
                      "$TARGET" --output /tmp/spineinnovlabs-live.html; then
                      if grep -Fq "more connected business" /tmp/spineinnovlabs-live.html; then
                        success=1
                        break
                      fi
                    fi
                    echo "Attempt $attempt: expected corporate hero not live yet; retrying..."
                    sleep 8
                  done
                  if [ "$success" -ne 1 ]; then
                    echo "ERROR: Cloudflare reported deploy, but production homepage did not show the new hero." >&2
                    exit 1
                  fi
                  echo "Production hostname verified: new Spine InnovLabs hero is live."
      - optional-datadog-dora:
          environment: << parameters.datadog_env >>

workflows:
  build-test-deploy:
    jobs:
      - build

      - deploy:
          name: deploy-production
          wrangler_env: prod
          datadog_env: production
          requires:
            - build
          filters:
            branches:
              only: main

      - deploy:
          name: deploy-dev
          wrangler_env: dev
          datadog_env: development
          requires:
            - build
          filters:
            branches:
              only: dev

      - deploy:
          name: deploy-test
          wrangler_env: test
          datadog_env: staging
          requires:
            - build
          filters:
            branches:
              only: test
